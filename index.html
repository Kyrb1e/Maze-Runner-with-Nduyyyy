<style>
:root{--a:#ffd1e0;--b:#7b2d5b;--ink:#fff;--acc:#ffcf5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--a),var(--b));transition:background .6s}
h1,h2{font-family:'Shippori Mincho',serif;margin:0}
#menu{height:100%;overflow-y:auto;padding:18px 16px 28px;max-width:760px;margin:auto}
#menu h1{font-size:clamp(30px,8vw,54px);line-height:1;text-shadow:0 4px 20px #0006}
#menu .sub{opacity:.85;margin:6px 0 16px}
.sec{background:#0004;backdrop-filter:blur(8px);border-radius:14px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid #fff4;background:#0003;color:#fff;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;text-align:left}
.chip.on{border-color:var(--acc);background:#0007;box-shadow:0 0 14px var(--acc)}
.chip small{display:block;opacity:.75;font-size:11px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.themes .chip{text-align:center;font-size:13px}.themes .chip span{font-size:22px;display:block}
#prevwrap{display:flex;gap:12px;align-items:center}
#prev{border-radius:10px;border:2px solid #fff5;flex:none}
#go{width:100%;padding:16px;font:800 22px 'Shippori Mincho',serif;border:0;border-radius:14px;background:var(--acc);color:#2a1020;cursor:pointer;box-shadow:0 6px 0 #0006}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #0006}
#game{display:none;height:100%;flex-direction:column;align-items:center}
#hud{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px;font-weight:600}
#hud b{font-family:'Shippori Mincho',serif;font-size:20px}
#stat{text-align:center;flex:1}
#hud button{background:#0006;color:#fff;border:2px solid #fff5;border-radius:10px;padding:6px 12px;font:inherit}
#ctl{display:flex;align-items:center;gap:22px}
#cd{position:absolute;inset:0;z-index:4;pointer-events:none;display:none;align-items:center;justify-content:center}
#cd span{font:800 clamp(110px,34vw,260px)/1 'Shippori Mincho',serif;color:var(--acc);text-shadow:0 0 30px #000,0 0 60px var(--acc),6px 6px 0 #000a;animation:cdn 1s cubic-bezier(.2,1.4,.4,1) both}
#cd span.go{font-size:clamp(60px,18vw,150px);color:#fff;text-shadow:0 0 30px #000,0 0 70px #ff3b1f;animation:cdg .9s ease-out both}
#cd i{position:absolute;width:40%;aspect-ratio:1;border-radius:50%;border:5px solid var(--acc);box-shadow:0 0 30px var(--acc);animation:cdr .9s ease-out both}
@keyframes cdn{0%{transform:scale(2.8) rotate(-6deg);opacity:0;filter:blur(8px)}25%{transform:scale(1) rotate(0);opacity:1;filter:none}80%{opacity:1}100%{transform:scale(.7);opacity:.15}}
@keyframes cdg{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes cdr{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
.tick{animation:tk .28s}
@keyframes tk{0%{transform:scale(1.035) translate(4px,-3px)}50%{transform:scale(1.015) translate(-4px,3px)}100%{transform:none}}
#fz{width:78px;height:78px;border-radius:50%;border:2px solid #bfeaff99;background:radial-gradient(#3aa8d8aa,#0a2a4acc);color:#fff;font:700 15px Outfit,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:0 0 16px #5ac8ff66;touch-action:manipulation}
#fz img{width:46px;height:46px;margin-top:-4px;pointer-events:none}
#fz span{margin-top:-6px;text-shadow:0 1px 3px #000}
#fz:disabled{opacity:.4;box-shadow:none}
#fz.on{animation:fzp .5s infinite alternate}
@keyframes fzp{to{box-shadow:0 0 32px #9fe8ff}}
#stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cv{border-radius:8px;box-shadow:0 0 30px #000a;transition:filter 2.5s}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 #f00;transition:box-shadow .3s}
#rev{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;background:#000b;border:2px solid var(--acc);border-radius:14px;padding:6px 18px;text-align:center;display:none;font-weight:600;white-space:nowrap}
#rev b{font:800 36px 'Shippori Mincho',serif;display:block;line-height:1.1;color:var(--acc)}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px;padding:8px 0 14px;opacity:.6;touch-action:none}
#pad button{border:2px solid #fff6;background:#0005;color:#fff;font-size:26px;border-radius:16px}
#pad button:active,#pad button.h{background:#fff4;opacity:1}
#pinfo .ic{width:26px;height:26px}#tn .ic{width:28px;height:28px}.ic{width:34px;height:34px;vertical-align:middle;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;width:100%;height:100%}
#flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0}
#res{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
#res h2{font-size:clamp(40px,13vw,96px);animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
#res p{font-size:18px;margin:0}
#res .row{justify-content:center}
#res button{padding:12px 20px;border-radius:12px;border:0;font:700 18px Outfit;cursor:pointer}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-14px,8px) rotate(-1deg)}20%{transform:translate(12px,-10px) rotate(1deg)}30%{transform:translate(-10px,-6px)}40%{transform:translate(14px,10px) rotate(1deg)}50%{transform:translate(-8px,12px)}60%{transform:translate(10px,-8px) rotate(-1deg)}70%{transform:translate(-12px,4px)}80%{transform:translate(8px,-12px)}90%{transform:translate(-4px,6px)}}
.shake{animation:shake .9s 3}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.glitch{animation:gl .25s steps(2) infinite}
@keyframes gl{0%{text-shadow:6px 0 #0ff,-6px 0 #f0f;transform:translateX(-4px)}100%{text-shadow:-6px 0 #0ff,6px 0 #f0f;transform:translateX(4px)}}
@media(prefers-reduced-motion:reduce){.shake{animation-duration:.2s;animation-iteration-count:1}}
</style></head><body>

function sync(){
 mk($('modes'),MD,'m',a=>a[0]+'<small>'+a[1]+'</small>');
 mk($('lights'),LT,'n',a=>a[0]+'<small>'+a[1]+'</small>');
 mk($('sizes'),SS,'s',a=>a[0]+'<small>'+a[1]+'</small>');

 const t=TH[cfg.t];document.documentElement.style.setProperty('--a',t.bg[0]);document.documentElement.style.setProperty('--b',t.bg[1]);
 $('pinfo').innerHTML='<b>'+t.n+'</b><br>Kamu <img class="ic" src="'+spu(t,0)+'"> dikejar <img class="ic" src="'+spu(t,1)+'"><br><small>Dinding, musik, dan suasana ikut berubah.</small>';
 drawPrev();startBGM(t);

let AC,master,bgmT,bgmOn=true;
